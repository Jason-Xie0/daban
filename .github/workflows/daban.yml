name: daban-predict
# A股打板预测 云端定时运行(GitHub 免费额度)
# 北京时间交易日 14:30 = UTC 06:30; GitHub 定时可能有 5~30 分钟延迟, 见仓库 README 说明
on:
  schedule:
    - cron: "30 6 * * 1-5"
  workflow_dispatch: {}   # 支持手动触发

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: pip install -r deploy/requirements.txt

      - name: 运行预测(内置交易日守卫; 东财不可达自动切腾讯; 无LLM自动模板理由)
        run: python main.py

      - name: 回写报告与状态(样本库/战绩/预测池持续演进)
        run: |
          git config user.name  "daban-bot"
          git config user.email "bot@users.noreply.github.com"
          git add reports state
          git commit -m "daban run $(date -u +%F-%H:%M) UTC" || echo "nothing to commit"
          git pull --rebase || true
          git push

      - name: 推送报告到手机(微信; Secrets 配 DABAN_PUSH_KEY, 未配则跳过)
        if: success()
        continue-on-error: true
        env:
          DABAN_PUSH_KEY: ${{ secrets.DABAN_PUSH_KEY }}
        run: python deploy/notify.py reports/latest.md

      - name: 归档最新报告
        uses: actions/upload-artifact@v4
        with:
          name: daban-report
          path: reports/latest.md
